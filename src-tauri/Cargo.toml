[package]
name = "clicktotweak"
version = "1.0.0"
description = "Click To Tweak Modern - Next-Gen System Utility"
authors = ["Antigravity"]
edition = "2024"

[lib]
name = "clicktotweak_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"
sysinfo = "0.33"
walkdir = "2.5"
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_Security",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[patch.crates-io]
webview2-com-sys = { path = "patches/webview2-com-sys" }
